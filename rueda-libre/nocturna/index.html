<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rueda Nocturna | Rueda Libre</title>
    <link rel="stylesheet" href="src/output.css">
</head>
<body class="bg-slate-900 text-white">

    <section class="mx-auto max-w-3xl px-6 py-16 text-center space-y-6">

        <p class="inline-block rounded-full bg-amber-400 px-4 py-1 text-sm font-semibold uppercase tracking-widest text-slate-900">
            Nuevo · Jueves a sábado
        </p>

        <h1 class="text-4xl font-bold leading-tight md:text-6xl">
            Rueda Nocturna
        </h1>

        <p class="text-lg leading-relaxed text-slate-300">
            Descubre Medellín en bici cuando se encienden las luces
        </p>

        <ul class="flex justify-center gap-8">
            <li><span class="block text-3xl font-bold text-amber-400">3 rutas</span></li>
            <li><span class="block text-3xl font-bold text-amber-400">Desde $55.000</span></li>
        </ul>

        <a href="#botones"
           class="inline-block rounded-lg bg-emerald-700 px-8 py-3 text-lg font-semibold text-white shadow-lg hover:bg-emerald-600 focus:outline-none focus:ring-4 focus:ring-amber-300 focus:ring-offset-2 focus:ring-offset-slate-900">
            Inscríbete
        </a>

    </section>

    <section id="botones" class="mx-auto max-w-3xl px-6 pb-16 space-y-6">
        <h2 class="text-2xl font-bold">Botones</h2>

        <div class="flex flex-wrap gap-4">

            <!-- Principal -->
            <button type="button"
                    class="rounded-lg bg-emerald-700 px-6 py-3 font-semibold text-white shadow-md hover:bg-emerald-600 focus:outline-none focus:ring-4 focus:ring-amber-300 focus:ring-offset-2 focus:ring-offset-slate-900">
                Principal
            </button>

            <!-- Secundario -->
            <button type="button"
                    class="rounded-lg bg-amber-400 px-6 py-3 font-semibold text-slate-900 shadow-md hover:bg-amber-300 focus:outline-none focus:ring-4 focus:ring-white focus:ring-offset-2 focus:ring-offset-slate-900">
                Secundario
            </button>

            <!-- Contorno -->
            <button type="button"
                    class="rounded-lg border-2 border-white px-6 py-3 font-semibold text-white hover:bg-white hover:text-slate-900 focus:outline-none focus:ring-4 focus:ring-amber-300 focus:ring-offset-2 focus:ring-offset-slate-900">
                Contorno
            </button>

        </div>
    </section>

</body>
</html>
